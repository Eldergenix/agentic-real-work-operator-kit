  - support_requested
  - reservation_created
  - reservation_committed
  - reservation_refunded
  - attempt_claimed
  - provider_request_started
  - provider_acknowledged
  - provider_timeout_uncertain
  - verification_observed
  - action_verified
  - reconciliation_scheduled
  - compensation_started
