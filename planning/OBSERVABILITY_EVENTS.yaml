version: 1
redaction:
  forbidden:
    - credentials
    - authorization headers
    - cookies
    - PAN
    - CVV
    - password
    - OTP
    - raw health measurements
    - raw private message bodies by default
common_fields:
  - request_id
  - owner_user_hash
  - mission_id
  - run_id
  - goal_spec_id
  - goal_spec_version
  - intent_epoch
  - plan_id
  - plan_version
  - action_id
  - attempt_id
  - provider
  - adapter_id
  - adapter_version
  - policy_hash
  - mandate_id
  - mandate_version
  - consent_epoch
  - connector_epoch
  - kill_switch_epoch
  - deployment_ref
  - timestamp
